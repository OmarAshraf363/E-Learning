<div class="layout-instructor d-flex overflow-hidden">
  <nav class="sidebar bg-dark text-white p-3 vh-100 position-fixed" style="width: 250px">
    <h5 class="mb-4"><i class="fas fa-chalkboard-teacher me-2"></i>Instructor</h5>
    <ul class="nav flex-column">
      @for (item of nav; track item.link) {
        <li class="nav-item mb-2">
          <a class="nav-link text-white" [routerLink]="item.link"
             routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.link === '/instructor' }">
            <i [class]="item.icon + ' me-2'"></i> {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="flex-grow-1 d-flex flex-column vh-100 overflow-hidden" style="margin-left: 250px">
    <header class="navbar navbar-expand-lg align-items-center navbar-dark px-4">
      <h4>{{ auth.user()?.userName }}</h4>
      <div class="container-fluid justify-content-end">
        <app-user-menu />
      </div>
    </header>

    <main class="overflow-auto p-4">
      <router-outlet />
    </main>
  </div>
</div>
