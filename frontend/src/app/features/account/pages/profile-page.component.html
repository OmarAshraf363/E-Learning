<div class="card shadow-sm">
  <div class="card-header text-center bg-primary text-white">
    <h3>Profile</h3>
  </div>
  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-group mb-4">
        <label for="userName" class="form-label fw-bold">Username</label>
        <input id="userName" class="form-control form-control-lg" [value]="userName()" disabled />
      </div>

      <div class="form-group mb-4">
        <label for="phoneNumber" class="form-label fw-bold">Phone Number</label>
        <input id="phoneNumber" formControlName="phoneNumber" class="form-control form-control-lg" placeholder="Please enter your phone number." />
        <app-form-errors [control]="form.controls.phoneNumber" />
      </div>

      <div class="form-group mb-4">
        <label for="jopDescription" class="form-label fw-bold">Description</label>
        <textarea id="jopDescription" formControlName="jopDescription" class="form-control form-control-lg" placeholder="Please enter your description."></textarea>
      </div>

      <div class="form-group mb-4">
        <label for="profilePicture" class="form-label fw-bold">Profile Picture</label>
        <input id="profilePicture" type="file" accept="image/*" class="form-control form-control-lg" (change)="onFileSelected($event)" />
        <app-form-errors [control]="form.controls.profilePicture" />
      </div>

      <div class="text-center mb-4">
        <img [src]="picture() | fileUrl: 'images/default-avatar.svg'" alt="Profile Picture"
             class="rounded-circle border border-3" style="width: 150px; height: 150px; object-fit: cover" />
      </div>

      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary btn-lg" [disabled]="saving()">
          <i class="fas fa-save me-2"></i> Save Changes
        </button>
      </div>
    </form>
  </div>
</div>
