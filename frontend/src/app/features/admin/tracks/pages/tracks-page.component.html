<section class="tracks container my-5 py-4">
  <div class="tracks-header d-flex align-items-center justify-content-between mb-4">
    <h2 class="fw-bold text-primary">Explore Our Tracks</h2>
    <div class="d-flex align-items-center gap-3">
      <span class="text-muted">{{ store.items().length }} Tracks Available</span>
      <button type="button" class="btn btn-primary" (click)="openForm()"><i class="fas fa-plus"></i> New Track</button>
    </div>
  </div>

  <div class="row g-4">
    @for (track of store.items(); track track.id) {
      <div class="col-lg-4 col-md-6">
        <div class="one-track card shadow-sm h-100 border-0">
          <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
            <h5 class="m-0 text-truncate">{{ track.name }}</h5>
            <button type="button" class="btn btn-outline-light btn-sm" (click)="openForm(track.id)"><i class="fas fa-edit"></i> Edit</button>
          </div>
          <div class="card-body text-secondary">
            <p class="mb-0 text-truncate" [title]="track.description">{{ track.description }}</p>
          </div>
          <div class="card-footer bg-dark text-white d-flex justify-content-between align-items-center">
            <span><i class="fas fa-book"></i> {{ track.coursesCount }} Courses</span>
            <div>
              <a [routerLink]="['/admin/tracks', track.id]" class="btn btn-outline-info btn-sm me-2"><i class="fas fa-eye"></i> View</a>
              <button type="button" class="btn btn-outline-danger btn-sm" (click)="remove(track.id)"><i class="fas fa-trash"></i> Delete</button>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</section>
