<h2>{{ isEdit ? 'Edit User' : 'Create User' }}</h2>

<form [formGroup]="form" (ngSubmit)="save()" novalidate>
  <div class="form-group mb-2">
    <label for="fullName">Full Name</label>
    <input id="fullName" formControlName="fullName" class="form-control" />
  </div>

  <div class="form-group mb-2">
    <label for="userName">UserName</label>
    <input id="userName" formControlName="userName" class="form-control" />
    <app-form-errors [control]="form.controls.userName" />
  </div>

  <div class="form-group mb-2">
    <label for="email">Email</label>
    <input id="email" formControlName="email" class="form-control" />
    <app-form-errors [control]="form.controls.email" />
  </div>

  @if (!isEdit) {
    <div class="form-group mb-2">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" class="form-control" autocomplete="new-password" />
      <app-form-errors [control]="form.controls.password" />
    </div>
  }

  <div class="form-group mb-3">
    <label for="role">Role</label>
    <select id="role" formControlName="role" class="form-control">
      <option value="">Select a role</option>
      @for (role of roles(); track role) {
        <option [value]="role">{{ role }}</option>
      }
    </select>
    <app-form-errors [control]="form.controls.role" />
  </div>

  @if (selectedRole() === 'Instructor') {
    <div class="form-group mb-3">
      <label for="departmentId">Department</label>
      <select id="departmentId" formControlName="departmentId" class="form-control">
        <option [ngValue]="null">No department (can teach in any department)</option>
        @for (d of departments(); track d.id) {
          <option [ngValue]="d.id">{{ d.name }}</option>
        }
      </select>
      <app-form-errors [control]="form.controls.departmentId" />
    </div>
  }

  @for (message of generalErrors(); track message) {
    <div class="text-danger">{{ message }}</div>
  }

  <button type="submit" class="btn btn-primary" [disabled]="saving()">{{ isEdit ? 'Edit User' : 'Create User' }}</button>
</form>
