<div class="container mt-4">
  <div class="head d-flex justify-content-between align-items-center mb-4">
    <h3 class="text-white">Department List</h3>
    <div class="search-container d-flex align-items-center w-50">
      <div class="input-group">
        <input type="search" class="form-control search" placeholder="Search..." [value]="search()" (input)="search.set($any($event.target).value)" />
        <span class="input-group-text search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
      </div>
    </div>
    <button type="button" class="btn new-course-btn" (click)="openForm()"><i class="fas fa-plus"></i> New Department</button>
  </div>

  <table class="table table-hover">
    <thead>
      <tr>
        <th>Department ID</th><th>Department Name</th><th>Courses</th><th>Instructors</th><th>Total Hours</th><th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (dept of rows(); track dept.id) {
        <tr>
          <td>{{ dept.id }}</td>
          <td>{{ dept.name }}</td>
          <td><a [routerLink]="['/admin/departments', dept.id, 'courses']" class="btn btn-danger btn-sm">Show</a></td>
          <td><a [routerLink]="['/admin/departments', dept.id]" class="btn btn-danger btn-sm">Show</a></td>
          <td>{{ dept.totalHours }}</td>
          <td class="d-flex gap-1">
            <a [routerLink]="['/admin/departments', dept.id]" class="btn btn-info btn-sm">Details</a>
            <button type="button" class="btn btn-warning btn-sm" (click)="openForm(dept.id)">Edit</button>
            <button type="button" class="btn btn-danger btn-sm" (click)="remove(dept.id)">Delete</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="6" class="text-center text-muted">{{ store.loading() ? 'Loading...' : 'No departments found.' }}</td></tr>
      }
    </tbody>
  </table>
</div>
