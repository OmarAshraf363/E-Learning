<div class="row login-row">
  <div class="col-md-4">
    <section class="login-container">
      <form (ngSubmit)="submit()" [formGroup]="form" novalidate>
        <h2>Log in to your account</h2>

        @if (error()) {
          <div class="text-danger mb-3" role="alert">{{ error() }}</div>
        }

        <div class="form-floating mb-3">
          <input id="email" formControlName="email" class="form-control" autocomplete="username" placeholder="name@example.com" />
          <label for="email" class="form-label">Email</label>
          <app-form-errors [control]="form.controls.email" />
        </div>

        <div class="form-floating mb-3">
          <input id="password" type="password" formControlName="password" class="form-control" autocomplete="current-password" placeholder="password" />
          <label for="password" class="form-label">Password</label>
          <app-form-errors [control]="form.controls.password" />
        </div>

        <button id="login-submit" type="submit" class="w-100 btn btn-lg btn-primary" [disabled]="submitting()">
          @if (submitting()) { <span class="spinner-border spinner-border-sm me-2"></span> }
          Log in
        </button>

        <div class="mt-3">
          <p>Don't have an account? <a routerLink="/auth/register">Register</a></p>
        </div>
      </form>
    </section>
  </div>

  <div class="img-sec col-md-4">
    <img src="images/login.png" alt="Login Image" />
  </div>
</div>
